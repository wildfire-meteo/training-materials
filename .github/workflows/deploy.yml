# Adapted from `jupyter book init --gh-pages`: installs Python and odet_meteo,
# and executes the notebooks, so every figure is built from the committed code.
# Set the repository's Settings > Pages > Source to "GitHub Actions".

name: Deploy book to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # URL path the site is served from: https://<org>.github.io/<repo>
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Jupyter Book and odet_meteo
        run: pip install -r requirements.txt
      - name: Build the book, executing the notebooks
        run: jupyter book build --html --execute
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html
      - id: deployment
        uses: actions/deploy-pages@v4
